name: Regression and portable scenario
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: os-agent track1 --scenario examples/track1/maintenance-handover.json --output artifacts/track1
      - run: python scripts/package-track1.py --output dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/track1/*/report.*
            dist/*
