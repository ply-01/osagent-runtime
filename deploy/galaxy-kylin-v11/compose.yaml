name: osagent-galaxy-kylin-v11

services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0-slim}
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOST: ${WEBUI_BIND_ADDRESS:-127.0.0.1}
      # The gateway owns the externally forwarded port; keep Open WebUI on an
      # internal host-network port so the gateway can inject the OSagent entry.
      PORT: 10201
      WEBUI_AUTH: "False"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      WEBUI_URL: ${WEBUI_PUBLIC_URL:-http://127.0.0.1:${WEBUI_PORT:-10200}}
      OS_AGENT_PUBLIC_WEBUI_URL: ${WEBUI_PUBLIC_URL:-http://127.0.0.1:${WEBUI_PORT:-10200}}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://127.0.0.1:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
      DEFAULT_MODELS: ${OPENAI_MODEL:-}
      ENABLE_MEMORIES: "False"
      ENABLE_MEMORY_SYSTEM_CONTEXT: "False"
      ENABLE_MEMORY_BACKGROUND_REVIEW: "False"
      ENABLE_NOTES: "False"
      # Avoid network retries for Open WebUI's optional RAG model on the
      # offline V11 target. OSagent embedding runs in the native service.
      OFFLINE_MODE: "True"
      OS_AGENT_MEMORY_URL: http://127.0.0.1:${OS_AGENT_MEMORY_PORT:-8765}
      OS_AGENT_MEMORY_API_KEY: ${OS_AGENT_MEMORY_API_KEY:?set OS_AGENT_MEMORY_API_KEY in .env}
      OS_AGENT_MCP_AUTO_REGISTER: "True"
    volumes:
      - open-webui-data:/app/backend/data
      - ../../integrations/open_webui:/opt/osagent-integrations:ro

  osagent-webui-gateway:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0-slim}
    restart: unless-stopped
    depends_on:
      - open-webui
    network_mode: host
    command: ["python", "/opt/osagent-gateway/gateway.py"]
    volumes:
      - ./gateway.py:/opt/osagent-gateway/gateway.py:ro
      - ../../integrations/open_webui/marketplace-bridge.js:/opt/osagent-gateway/marketplace-bridge.js:ro
    environment:
      OS_AGENT_MEMORY_API_KEY: ${OS_AGENT_MEMORY_API_KEY:?set OS_AGENT_MEMORY_API_KEY in .env}
      OS_AGENT_MOBILE_API_KEY: ${OS_AGENT_MOBILE_API_KEY:?set OS_AGENT_MOBILE_API_KEY in .env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:10200/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  open-webui-data:
    name: ${OPEN_WEBUI_DATA_VOLUME:-osagent-galaxy-kylin-v11-webui-data}
